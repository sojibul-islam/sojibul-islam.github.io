<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Publications | Md. Sojibul Islam</title>
  <meta name="description" content="Peer-reviewed publications, preprints and conference presentations of Md. Sojibul Islam.">
  <link rel="canonical" href="https://rproblemsolver.github.io/publications.html">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>try { var t = localStorage.getItem("theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}</script>
</head>
<body data-page="publications">
  <div id="site-header"></div>

  <main id="main">
    <header class="page-hero">
      <div class="container">
        <p class="eyebrow">Publications</p>
        <h1>Publications</h1>
        <p>Peer-reviewed articles, preprints and conference presentations</p>
      </div>
    </header>

    <section class="section">
      <div class="container">
        <div class="card pub-panel">
          <div class="pub-sources">
            <h2 class="label">Publication profiles</h2>
            <div class="link-row" id="pub-sources"></div>
          </div>

          <div class="pub-controls">
            <label class="search">
              <span class="sr-only">Search publications</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <input type="search" id="pub-search" placeholder="Search title, author, journal…">
            </label>
            <label>Sort
              <select id="pub-sort">
                <option value="new">Year (newest first)</option>
                <option value="old">Year (oldest first)</option>
                <option value="title">Title (A–Z)</option>
              </select>
            </label>
            <label>Type
              <select id="pub-type"><option value="all">All types</option></select>
            </label>
            <label>Topic
              <select id="pub-topic"><option value="all">All topics</option></select>
            </label>
          </div>
          <p class="small muted" id="pub-count" aria-live="polite"></p>

          <ol class="pub-list numbered" id="pub-list"></ol>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
